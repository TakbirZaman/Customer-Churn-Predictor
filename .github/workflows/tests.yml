name: Retention integration checks
on: [push, pull_request]
jobs:
  python:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-retention.txt pytest httpx
      - run: python -m pytest -q
      - name: Verify Windows batch launcher and sample report
        if: runner.os == 'Windows'
        shell: cmd
        run: start-retention-windows.bat --check-startup
      - name: Verify Linux startup and sample report
        if: runner.os == 'Linux'
        run: python run_retention.py --check-startup
  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
